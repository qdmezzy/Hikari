<!doctype html>
<html lang="en">
  <body style="margin:0;background:#111214;color:#eeede8;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#111214;">
      <tr>
        <td align="center" style="padding:48px 20px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;">
            <tr>
              <td style="padding:0 0 22px;border-bottom:1px solid #343536;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td valign="middle">
                      <a href="https://hikari.raycodes.me" style="text-decoration:none;">
                        <img src="https://hikari.raycodes.me/brand/hikari-wordmark.png" alt="Hikari" width="160" height="113" style="display:block;width:160px;height:auto;border:0;color:#eeede8;font-size:18px;" />
                      </a>
                    </td>
                    <td align="right" valign="middle" style="color:#aaa69a;font-size:10px;letter-spacing:1.7px;line-height:22px;">ANIME &amp; MANGA</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:34px 0 8px;color:#c4b791;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;">Your account</td>
            </tr>
            <tr>
              <td style="padding:0 0 12px;font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.7px;">Confirm your email</td>
            </tr>
            <tr>
              <td style="padding:0 0 26px;color:#b8b7b2;font-size:15px;line-height:1.7;">Use the button below to confirm this address and finish creating your Hikari account.</td>
            </tr>
            <tr>
              <td style="padding:0 0 30px;">
                <a href="https://hikari.raycodes.me/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=%2F" style="display:inline-block;padding:13px 20px;background:#c4b791;color:#171719;text-decoration:none;font-size:14px;font-weight:700;">Confirm email&nbsp; →</a>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 0;border-top:1px solid #343536;color:#92918b;font-size:12px;line-height:1.65;">If you didn’t create a Hikari account, you can ignore this email.</td>
            </tr>
            <tr>
              <td style="padding:14px 0 0;color:#77766f;font-size:11px;letter-spacing:.3px;">HIKARI&nbsp; · &nbsp;Your anime and manga list</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
